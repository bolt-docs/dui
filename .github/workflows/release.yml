name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes an .npmrc with
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`, which is
          # what actually hands the publish step its credentials. Without
          # `registry-url` there is no auth at all: the committed .npmrc
          # only sets `shamefully-hoist` (the auth line was dropped in
          # 3279af4), so `npm publish` ran unauthenticated and the 0.7.0
          # release failed at the publish step.
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          # changesets publish shells out to `npm publish`, which reads the
          # token from the .npmrc that `registry-url` above generates. Both
          # names are set: pnpm-based tooling looks for NPM_TOKEN, npm itself
          # for NODE_AUTH_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.TOKEN_NPM }}
          NPM_TOKEN: ${{ secrets.TOKEN_NPM }}

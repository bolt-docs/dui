packages:
  - 'packages/*'
  - 'website'
  - 'examples'

# Security overrides — pin patched versions of transitive dependencies that
# were resolved to vulnerable releases in the lockfile. Scoped selectors
# (pkg@range, parent>child) keep the override surgical: each entry only
# touches the vulnerable package/version line it targets.
overrides:
  dompurify: 3.4.13
  form-data: 4.0.6
  undici: 7.29.0
  nanoid@^3: 3.3.18
  'vite>postcss': 8.5.26
  react-router-dom: 7.18.2
  react-router: 7.18.2
  svgo: 4.0.2
  esbuild: 0.28.1
  'brace-expansion@2': 2.1.4
  'brace-expansion@5': 5.0.9
  'boltdocs>vite': 8.0.16
